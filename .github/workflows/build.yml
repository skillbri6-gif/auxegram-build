name: Build AuxeGram APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK packages
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
          yes | sdkmanager --licenses > /dev/null || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Patch API credentials and make gradlew executable
        run: |
          sed -i 's/public static int APP_ID = [0-9]*/public static int APP_ID = 17349/' TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          sed -i 's/public static String APP_HASH = "[^"]*"/public static String APP_HASH = "344583e45741c457fe1862106095a5eb"/' TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          chmod +x gradlew

      - name: Build standalone APK
        run: ./gradlew :TMessagesProj_AppStandalone:assembleAfatStandalone --no-daemon -POWPENGRAM_BUILD=0

      - name: Commit APK to apk branch
        run: |
          APK=$(find TMessagesProj_AppStandalone/build/outputs -type f -name '*.apk' | head -1)
          cp "$APK" auxegram.apk
          ls -lh auxegram.apk
          git config user.name auxegram-builder
          git config user.email builder@users.noreply.github.com
          git checkout -B apk
          git add -f auxegram.apk
          git commit -m "Built AuxeGram APK" || true
          git push -f origin apk
